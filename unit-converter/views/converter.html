<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Unit Converter</title>
	<style>
		.nav-tabs {
			display: flex;
			gap: 8px;
			margin-bottom: 20px;
			border-bottom: 2px solid #ddd;
			padding-bottom: 8px;
		}

		.nav-tab {
			padding: 8px 16px;
			text-decoration: none;
			color: #333;
			background: #eee;
			border-radius: 4px;
		}

		.nav-tab.active {
			background: #007bff;
			color: white;
			font-weight: bold;
		}

		.form-group {
			margin-bottom: 15px;
		}

		#category-titile {
			text-transform: capitalize;
		}
	</style>
</head>

<body>

	<nav class="nav-tabs">
		{{range .Categories}}
		<a href="/converter?category={{.ID}}" class="nav-tab {{if eq .ID $.CurrentCategory}}active{{end}}">
			{{.Title}}
		</a>
		{{end}}
	</nav>

	{{if .Success}}

	<h1>Result of your calculation</h1>
	<p>{{.Result}}</p>
	<form method="POST">
		<input type="hidden" name="category" value="{{.CurrentCategory}}">
		<button type="submit" name="action" value="reset">Reset</button>
	</form>

	{{else}}
	<h1 id="category-titile">{{.CurrentCategory}} Converter</h1>
	<form method="POST">
		<input type="hidden" name="category" value="{{.CurrentCategory}}">
		<div class="form-group">
			<label for="fromValue">Enter the {{.CurrentCategory}} to convert:</label><br>
			<input type="number" step="any" id="fromValue" name="fromValue" value="{{.FromValue}}" required>
		</div>
		<div class="form-group">
			<label for="from">Unit to Convert from:</label><br />
			<select id="from" name="from" required>
				<option value="">Select unit</option>
				{{range .AvailableUnits}}
				<option value="{{.}}" {{if eq . $.FromUnit}}selected{{end}}>{{.}}</option>
				{{end}}
			</select>
		</div>
		<div class="form-group">
			<label for="to">Unit to Convert to:</label><br />
			<select id="to" name="to" required>
				<option value="">Select unit</option>
				{{range .AvailableUnits}}
				<option value="{{.}}" {{if eq . $.ToUnit}}selected{{end}}>{{.}}</option>
				{{end}}
			</select>
		</div>
		<button type="submit" name="action" value="convert">Convert</button>
	</form>
	{{end}}

</body>

</html>
